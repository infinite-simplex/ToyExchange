# linuxptp config for the NetworkGateway host — the fixed PTP master for
# this deployment. See Tools/ptp/README.md for the full rationale and setup
# steps; this file only needs the settings that differ from ptp4l's defaults.
#
# Software timestamping (no PTP-capable NIC required): ptp4l disciplines
# the kernel clock directly via SO_TIMESTAMPING/adjtimex, using ordinary
# UDP over the existing network path instead of NIC hardware timestamps.
# Realistic accuracy in this mode is tens of microseconds on a LAN — far
# better than plain NTP, nowhere near what hardware timestamping buys you,
# and enough to make cross-machine telemetry deltas meaningful instead of
# dominated by clock error.
#
# The gateway is fixed as master (rather than letting the Best Master Clock
# Algorithm decide automatically) because the topology here is small and
# already has an obvious, always-up candidate: the same NetworkGateway
# process this exchange already treats as its trusted arbiter elsewhere
# (see NetworkService/Arbitration/ReplicaArbiter.hpp) is also the natural
# choice for "the clock everyone else agrees with."

[global]
slaveOnly               0
priority1               128
priority2               128
domainNumber            0
time_stamping           software
network_transport       UDPv4

# The interface below is a placeholder — replace with the gateway host's
# actual NIC (e.g. eth0, ens5) when running ptp4l:
#   ptp4l -f ptp4l-master.conf -i <interface> -S -m
