# linuxptp config for a MatchingService replica host — syncs to the
# NetworkGateway host's ptp4l instance (see ptp4l-master.conf). One copy of
# this file per replica machine; nothing here needs to change per-replica.
#
# slaveOnly forces this node to only ever follow, never become master —
# deliberate given the small, known topology (see README.md); this isn't
# meant to auto-elect a master via the Best Master Clock Algorithm.

[global]
slaveOnly               1
time_stamping           software
network_transport       UDPv4

# The interface below is a placeholder — replace with this replica host's
# actual NIC when running ptp4l:
#   ptp4l -f ptp4l-slave.conf -i <interface> -S -m
