name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # This project uses Linux-only APIs (epoll, mmap, multicast sockets,
    # clock_gettime(CLOCK_TAI)), so it builds and runs here, not on
    # windows-latest, even though local development happens via WSL.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Do not cache build/_deps: it holds compiled googletest, built with
      # -march=native (see CMakeLists.txt). Restored onto a runner with a
      # different CPU, that library crashes with SIGILL at test teardown.

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure
